<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>온라인 동시 접속 테스트</title>
<style>body{font-family:system-ui,sans-serif;background:#f3f6fb;color:#17243b;margin:0;padding:24px}main{max-width:700px;margin:auto;background:white;padding:24px;border-radius:16px}h1{font-size:24px}p{line-height:1.65;color:#526987}button,input{font:inherit;padding:12px;border:1px solid #dce5f2;border-radius:8px}button{cursor:pointer;background:#2463eb;color:white}button:disabled{opacity:.5}label{display:block;margin:20px 0}input{width:70px}pre{white-space:pre-wrap;line-height:1.7;background:#f3f6fb;padding:16px;border-radius:8px}a{color:#2463eb}</style>
<main><h1>온라인 동시 접속 테스트</h1><p>브라우저 하나에서 별도의 테스트방을 만들고, 팀장 5명과 관전자들을 동시에 연결합니다. 20번 선발과 최종 확정이 모두에게 동일하게 전달되는지 확인한 뒤 테스트방을 정리합니다.</p><label>테스트 인원 <input id="count" type="number" min="5" max="50" value="30"> 명</label><button id="start">테스트 시작</button> <button id="stop" disabled>중지</button><pre id="status" role="status">대기 중</pre><p>같은 브라우저의 일반 탭은 접속 정보를 공유하므로 인원이 늘어나지 않습니다. 이 화면은 참가자마다 별도 접속 정보를 생성합니다.</p><a href="../">드래프트로 돌아가기</a></main>
<script type="module">
import {ONLINE_SERVER_URL} from '../js/online-config.js';import {runRoomTest} from './room-test.mjs';
const start=document.querySelector('#start'),stop=document.querySelector('#stop'),status=document.querySelector('#status');let controller;
start.onclick=async()=>{controller=new AbortController();start.disabled=true;stop.disabled=false;try{const result=await runRoomTest({serverUrl:ONLINE_SERVER_URL,count:Number(document.querySelector('#count').value),signal:controller.signal,onProgress:p=>{status.textContent=p.stage==='connecting'?`접속 중: ${p.connected}/${p.count}명`:p.stage==='draft'?`연결 ${p.count}명 · 선발 동기화 ${p.picks}/20`: '테스트방 정리 중…';}});status.textContent=`검증 통과\n동시 접속: ${result.count}명 (팀장 5명 / 관전자 ${result.spectators}명)\n20번 선발·최종 확정·전원 상태 일치 확인\n입장 완료: ${(result.joinMs/1000).toFixed(2)}초\n전체 드래프트: ${(result.draftMs/1000).toFixed(2)}초\n테스트방 정리 완료`;}catch(e){status.textContent='테스트 실패 또는 중지: '+e.message;}finally{start.disabled=false;stop.disabled=true;}};
stop.onclick=()=>controller?.abort();
</script></html>
